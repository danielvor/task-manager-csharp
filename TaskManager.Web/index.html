<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas Júnior</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body>
    <div class="app-container">

        <header class="header">
            <h1>Minhas Tarefas</h1>
            <p>Gerencie seu dia com facilidade</p>
        </header>

        <section class="add-task-container">
            <form id="taskForm">
                <input type="text" id="taskTitle" placeholder="O que você precisa fazer?" required autocomplete="off">
                <button type="submit" class="btn-primary" id="addBtn">
                    <i class="fas fa-plus"></i> Adicionar
                </button>
            </form>
        </section>

        <section class="tasks-section">
            <div class="tasks-controls">
                <p>Você tem <span id="taskCount">0</span> tarefas</p>
            </div>

            <ul id="taskList" class="task-list">
                <!-- As tarefas serão inseridas aqui pelo JS -->
            </ul>
        </section>

    </div>

    <footer class="app-footer">
        <p>Projeto de Estudo: Gerenciador de Tarefas Fullstack (API ASP.NET Core & Front-end Vanilla JS).</p>
    </footer>

    <script src="app.js"></script>
</body>

</html>
